<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2547">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Por Trás da Cidade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main id="wrap">
    <div id="game" role="img"
      aria-label="Mapa de Vila Horizonte, visto de cima. Use o teclado ou o direcional na tela para andar."></div>
    <p id="region" class="hud" aria-live="polite"></p>
    <p id="hint" class="hud">Chegue perto de uma pessoa e aperte E ou Espaço</p>
    <div id="toast" class="toast" aria-live="polite" hidden></div>

    <section id="dialog" class="panel" role="dialog" aria-modal="true" aria-labelledby="dlg-name" hidden>
      <h2 id="dlg-name"></h2>
      <p id="dlg-text"></p>
      <ul id="dlg-clues" hidden></ul>
      <div id="dlg-opts" role="group" aria-label="Alternativas"></div>
      <p id="dlg-fb" role="status" aria-live="polite"></p>
      <button id="dlg-ok" class="btn">Continuar</button>
    </section>

    <section id="menu" class="overlay" role="dialog" aria-modal="true" aria-labelledby="menu-title">
      <div class="panel">
        <h1 id="menu-title">Por Trás da Cidade</h1>
        <p class="slogan">Nem todo herói usa capa. Alguns fazem a cidade funcionar.</p>
        <button id="btn-play" class="btn">Jogar</button>
        <div class="menu-audio-box">
          <button id="btn-track-menu" class="btn ghost small" type="button" aria-label="Trocar música">🎵 1. Vila Chiptune</button>
          <button id="btn-mute-menu" class="btn ghost small" type="button" aria-label="Alternar mudo">🔊 Som Ligado</button>
        </div>
        <button id="btn-settings" class="btn">Configurações & Áudio</button>
        <button id="btn-reset" class="btn ghost">Apagar progresso</button>
      </div>
    </section>

    <section id="settings" class="overlay" role="dialog" aria-modal="true" aria-labelledby="set-title" hidden>
      <div class="panel">
        <h2 id="set-title">Configurações & Áudio</h2>
        <label class="opt"><input type="checkbox" id="opt-contrast"> Alto contraste</label>
        <label class="opt"><input type="checkbox" id="opt-bigfont"> Letras maiores</label>
        <label class="opt"><input type="checkbox" id="opt-calm"> Reduzir animações</label>
        <label class="opt"><input type="checkbox" id="opt-music"> Som / Música ligada</label>
        <div class="opt-row">
          <label for="select-track">Trilha sonora:</label>
          <select id="select-track" class="select-track">
            <option value="0">1. Vila Chiptune (8-bit original)</option>
            <option value="1">2. Tema da Cidade (Nova trilha)</option>
          </select>
        </div>
        <button id="set-back" class="btn">Voltar</button>
      </div>
    </section>

    <div id="top-bar" class="top-bar" hidden>
      <button id="btn-mute-hud" class="btn small" aria-label="Alternar som (M)" title="Mudo (tecla M)">🔊</button>
      <button id="btn-track-hud" class="btn small" aria-label="Trocar música (T)" title="Trocar música (tecla T)">🎵
        1</button>
      <button id="btn-pause" class="btn small" aria-label="Pausar e abrir o menu">Menu</button>
    </div>

    <div id="touch" hidden>
      <div class="dpad" role="group" aria-label="Direcional">
        <button data-d="up" aria-label="Para cima">▲</button>
        <button data-d="left" aria-label="Para a esquerda">◀</button>
        <button data-d="right" aria-label="Para a direita">▶</button>
        <button data-d="down" aria-label="Para baixo">▼</button>
      </div>
      <button id="btn-act" class="btn act" aria-label="Interagir">E</button>
    </div>
  </main>
  <script src="js/lib/phaser.min.js"></script>
  <script src="js/state.js"></script>
  <script src="js/music.js"></script>
  <script src="js/data/npcs.js"></script>
  <script src="js/data/missions.js"></script>
  <script src="js/scenes/BootScene.js"></script>
  <script src="js/scenes/WorldScene.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
