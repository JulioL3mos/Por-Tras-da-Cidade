<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Por Trás da Cidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2547;--paper:#fff6dc;--sun:#ffc93c;--leaf:#4fa34a;--sky:#3f8fd8;--brick:#c8503c;--fs:18px}
body.contrast{--ink:#000;--paper:#fff;--sun:#ffe600;--sky:#0033cc;--brick:#b00020}
body.bigfont{--fs:24px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ink);font-family:system-ui,sans-serif;font-size:var(--fs);overscroll-behavior:none}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#game{width:100%;height:100%}#game canvas{image-rendering:pixelated}
.hud{position:absolute;left:12px;margin:0;padding:8px 12px;background:var(--paper);border:4px solid var(--ink);font-family:'Press Start 2P',monospace;font-size:calc(var(--fs)*.55);pointer-events:none}
#region{top:12px}#hint{top:64px;font-family:system-ui}
.panel{background:var(--paper);border:6px solid var(--ink);box-shadow:0 0 0 4px var(--sun),8px 8px 0 4px rgba(0,0,0,.35);padding:20px;max-width:560px;width:92%}
.panel h1,.panel h2{font-family:'Press Start 2P',monospace;line-height:1.5;margin:0 0 12px;font-size:calc(var(--fs)*1.1)}
.slogan{margin:0 0 18px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(29,37,71,.88);z-index:10}
.overlay[hidden],#dialog[hidden],#touch[hidden],#btn-pause[hidden],.hud[hidden]{display:none}
#dialog{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:8;max-width:760px}
#dlg-text{margin:0 0 14px;line-height:1.5}
.btn{display:block;width:100%;min-height:56px;margin:10px 0 0;padding:12px 16px;font:inherit;font-weight:700;color:var(--paper);background:var(--sky);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
:focus-visible{outline:5px solid var(--brick);outline-offset:3px}
.btn.small{position:absolute;top:12px;right:12px;width:auto;z-index:5;margin:0}
.opt{display:flex;align-items:center;gap:14px;min-height:56px;font-weight:600}
.opt input{width:32px;height:32px}
#touch{position:absolute;inset:auto 0 max(14px,env(safe-area-inset-bottom)) 0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:none;z-index:6}
#touch>*{pointer-events:auto}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:6px;grid-template-areas:". up ." "left down right"}
.dpad button{font-size:24px;border:4px solid var(--ink);background:var(--paper);color:var(--ink);touch-action:none}
.dpad [data-d=up]{grid-area:up}.dpad [data-d=left]{grid-area:left}.dpad [data-d=right]{grid-area:right}.dpad [data-d=down]{grid-area:down}
.btn.act{width:88px;height:88px;border-radius:50%;font-size:28px;background:var(--brick)}
body.calm *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#dlg-clues{margin:0 0 12px;padding-left:22px;line-height:1.5}#dlg-clues[hidden]{display:none}
#dlg-fb{margin:10px 0 0;font-weight:700;min-height:1.2em}#dlg-opts .btn{background:var(--paper);color:var(--ink);text-align:left}
#dialog{max-height:85vh;overflow:auto}

</style>
</head>
<body>
<main id="wrap">
  <div id="game" role="img" aria-label="Mapa de Vila Horizonte, visto de cima. Use o teclado ou o direcional na tela para andar."></div>
  <p id="region" class="hud" aria-live="polite"></p>
  <p id="hint" class="hud">Chegue perto de uma pessoa e aperte E ou Espaço</p>

  <section id="dialog" class="panel" role="dialog" aria-modal="true" aria-labelledby="dlg-name" hidden>
    <h2 id="dlg-name"></h2><p id="dlg-text"></p>
    <ul id="dlg-clues" hidden></ul>
    <div id="dlg-opts" role="group" aria-label="Alternativas"></div>
    <p id="dlg-fb" role="status" aria-live="polite"></p>
    <button id="dlg-ok" class="btn">Continuar</button>
  </section>

  <section id="menu" class="overlay" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="panel">
      <h1 id="menu-title">Por Trás da Cidade</h1>
      <p class="slogan">Nem todo herói usa capa. Alguns fazem a cidade funcionar.</p>
      <button id="btn-play" class="btn">Jogar</button>
      <button id="btn-settings" class="btn">Acessibilidade</button>
      <button id="btn-reset" class="btn ghost">Apagar progresso</button>
    </div>
  </section>

  <section id="settings" class="overlay" role="dialog" aria-modal="true" aria-labelledby="set-title" hidden>
    <div class="panel">
      <h2 id="set-title">Acessibilidade</h2>
      <label class="opt"><input type="checkbox" id="opt-contrast"> Alto contraste</label>
      <label class="opt"><input type="checkbox" id="opt-bigfont"> Letras maiores</label>
      <label class="opt"><input type="checkbox" id="opt-calm"> Reduzir animações</label>
      <button id="set-back" class="btn">Voltar</button>
    </div>
  </section>

  <button id="btn-pause" class="btn small" aria-label="Pausar e abrir o menu" hidden>Menu</button>

  <div id="touch" hidden>
    <div class="dpad" role="group" aria-label="Direcional">
      <button data-d="up" aria-label="Para cima">▲</button>
      <button data-d="left" aria-label="Para a esquerda">◀</button>
      <button data-d="right" aria-label="Para a direita">▶</button>
      <button data-d="down" aria-label="Para baixo">▼</button>
    </div>
    <button id="btn-act" class="btn act" aria-label="Interagir">E</button>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
// Estado global e salvamento automático (localStorage)
const Save = {
  key: 'por-tras-da-cidade-v1',
  data: { stars: [], settings: { contrast: false, bigfont: false, calm: false } },
  load() {
    try { Object.assign(this.data, JSON.parse(localStorage.getItem(this.key)) || {}); } catch (e) {}
    this.applySettings();
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {} },
  reset() { this.data.stars = []; this.save(); },
  applySettings() {
    const s = this.data.settings;
    document.body.classList.toggle('contrast', s.contrast);
    document.body.classList.toggle('bigfont', s.bigfont);
    document.body.classList.toggle('calm', s.calm);
  }
};
// Entrada compartilhada entre teclado e toque
const Input = { up: false, down: false, left: false, right: false, act: false };

</script>

<script>
// Gera toda a pixel art por código (placeholders próprios; podem ser trocados por PNGs depois).
class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }
  tex(key, w, h, fn) {
    const g = this.make.graphics({ x: 0, y: 0, add: false });
    fn(g); g.generateTexture(key, w, h); g.destroy();
  }
  create() {
    const rnd = new Phaser.Math.RandomDataGenerator(['vila']);
    this.tex('grass', 32, 32, g => {
      g.fillStyle(0x6bbf59).fillRect(0, 0, 32, 32);
      for (let i = 0; i < 14; i++) { g.fillStyle(rnd.pick([0x5aab4a, 0x7ccf68])).fillRect(rnd.between(0, 30), rnd.between(0, 30), 2, 2); }
    });
    this.tex('path', 32, 32, g => {
      g.fillStyle(0xe3c98f).fillRect(0, 0, 32, 32);
      for (let i = 0; i < 10; i++) { g.fillStyle(0xd1b476).fillRect(rnd.between(0, 28), rnd.between(0, 28), 4, 2); }
    });
    this.tex('crop', 32, 32, g => {
      g.fillStyle(0x8b5a2b).fillRect(0, 0, 32, 32);
      for (let y = 4; y < 32; y += 8) { g.fillStyle(0x4fa34a).fillRect(2, y, 28, 3); g.fillStyle(0x7ccf68).fillRect(6, y - 2, 4, 2).fillRect(18, y - 2, 4, 2); }
    });
    this.tex('wall', 32, 32, g => {
      g.fillStyle(0xffffff).fillRect(0, 0, 32, 32).fillStyle(0xdddddd);
      for (let y = 0; y < 32; y += 8) { g.fillRect(0, y, 32, 1); for (let x = (y / 8) % 2 ? 0 : 8; x < 32; x += 16) g.fillRect(x, y, 1, 8); }
    });
    this.tex('roof', 32, 32, g => {
      g.fillStyle(0xffffff).fillRect(0, 0, 32, 32).fillStyle(0xcccccc);
      for (let y = 6; y < 32; y += 8) g.fillRect(0, y, 32, 2);
    });
    this.tex('door', 32, 32, g => { g.fillStyle(0x5b3a1e).fillRect(6, 4, 20, 28).fillStyle(0xffd166).fillRect(21, 18, 3, 3); });
    this.tex('tree', 32, 40, g => {
      g.fillStyle(0x6b4423).fillRect(13, 26, 6, 14);
      g.fillStyle(0x2f8a3e).fillCircle(16, 16, 15).fillStyle(0x3fa84e).fillCircle(11, 12, 7);
    });
    const person = (key, shirt, skin, hair) => this.tex(key, 24, 32, g => {
      g.fillStyle(0x000000, 0.25).fillEllipse(12, 30, 18, 6);
      g.fillStyle(0x2b3a67).fillRect(6, 22, 5, 8).fillRect(13, 22, 5, 8);
      g.fillStyle(shirt).fillRect(4, 12, 16, 12);
      g.fillStyle(skin).fillRect(6, 2, 12, 11).fillRect(2, 13, 3, 8).fillRect(19, 13, 3, 8);
      g.fillStyle(hair).fillRect(5, 0, 14, 5).fillRect(5, 4, 2, 4);
      g.fillStyle(0x1d2547).fillRect(9, 8, 2, 2).fillRect(14, 8, 2, 2);
    });
    person('player', 0xe94f37, 0xf2c9a0, 0x3a2a1a);
    NPCS.forEach(n => person('npc' + n.id, n.color, rnd.pick([0xf2c9a0, 0xc68e5e, 0x8d5a3b]), rnd.pick([0x2b1b0f, 0x6b3a1e, 0xd9b44a, 0x888888])));
    this.tex('mark', 16, 16, g => { g.fillStyle(0xffc93c).fillTriangle(0, 0, 16, 0, 8, 14).lineStyle(2, 0x1d2547).strokeTriangle(0, 0, 16, 0, 8, 14); });
    this.scene.start('World');
  }
}

</script>
<script>
// Exploração: mapa de Vila Horizonte (50x36 tiles), movimentação, colisões, NPCs.
const T = 32, MAP_W = 50, MAP_H = 36;
// [x, y, largura, altura, cor do telhado] em tiles
const BUILDINGS = [
  [2,2,5,4,0xc8503c],[9,2,5,4,0x3f8fd8],[15,3,4,3,0x8a5cc7],[2,8,4,3,0xe0a030],[19,8,4,3,0xc8503c],
  [27,2,6,5,0x3f8fd8],[35,2,5,4,0xe07a1f],[41,2,6,5,0x888888],[28,9,5,4,0xc8503c],[35,9,5,4,0x2fa84f],
  [3,20,9,6,0xd9468f],[14,25,8,6,0xffffff],
  [28,26,5,4,0xc8503c],[36,26,6,4,0x8a8a8a],[44,25,4,4,0x4a6fa5]
];
class WorldScene extends Phaser.Scene {
  constructor() { super('World'); }
  create() {
    const W = MAP_W * T, H = MAP_H * T;
    this.add.tileSprite(0, 0, W, H, 'grass').setOrigin(0);
    [[0,16,MAP_W,3],[24,0,3,MAP_H]].forEach(([x,y,w,h]) => this.add.tileSprite(x*T, y*T, w*T, h*T, 'path').setOrigin(0));
    [[30,20,6,4],[38,20,8,4],[30,31,5,3]].forEach(([x,y,w,h]) => this.add.tileSprite(x*T, y*T, w*T, h*T, 'crop').setOrigin(0));
    this.walls = this.physics.add.staticGroup();
    BUILDINGS.forEach(([x,y,w,h,c]) => {
      const body = this.add.tileSprite(x*T, y*T, w*T, h*T, 'wall').setOrigin(0).setTint(0xf2e2c4);
      this.add.tileSprite(x*T, y*T, w*T, T, 'roof').setOrigin(0).setTint(c);
      this.add.image(x*T + Math.floor(w/2)*T, (y+h-1)*T, 'door').setOrigin(0);
      this.physics.add.existing(body, true); this.walls.add(body);
    });
    [[1,14],[11,14],[22,13],[22,5],[1,30],[12,18],[23,22],[48,16],[46,12],[26,33]].forEach(([x,y]) => {
      const t = this.add.image(x*T, y*T, 'tree').setOrigin(0).setDepth(y*T+40);
      this.physics.add.existing(t, true); t.body.setSize(14, 10).setOffset(9, 28); this.walls.add(t);
    });
    this.npcs = NPCS.map(n => {
      const s = this.physics.add.staticImage(n.x*T + 16, n.y*T + 16, 'npc' + n.id).setDepth(n.y*T + 32);
      s.npc = n; s.mark = this.add.image(s.x, s.y - 30, 'mark').setDepth(9999);
      if (!Save.data.settings.calm) this.tweens.add({ targets: s.mark, y: s.y - 36, yoyo: true, repeat: -1, duration: 600 });
      return s;
    });
    this.player = this.physics.add.sprite(25*T + 16, 17*T, 'player');
    this.player.body.setSize(16, 12).setOffset(4, 20); this.player.setCollideWorldBounds(true);
    this.physics.world.setBounds(0, 0, W, H);
    this.physics.add.collider(this.player, this.walls);
    this.physics.add.collider(this.player, this.npcs);
    this.cameras.main.setBounds(0, 0, W, H).startFollow(this.player, true, 0.15, 0.15).setZoom(1.5);
    this.keys = this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT,E,SPACE,ESC');
    this.input.keyboard.addCapture('UP,DOWN,LEFT,RIGHT,SPACE');
    this.talking = false; this.regionId = 0;
    this.keys.E.on('down', () => this.interact()); this.keys.SPACE.on('down', () => this.interact());
    this.keys.ESC.on('down', () => window.UI.togglePause());
    window.UI.bindScene(this); this.refreshMarks();
  }
  refreshMarks() { this.npcs.forEach(n => n.mark.setVisible(!Save.data.stars.includes(n.npc.id))); }
  regionAt(x, y) { return (x < 25*T ? 0 : 1) + (y < 17*T ? 0 : 2) + 1; }
  nearestNpc() {
    let best = null, d = 56;
    this.npcs.forEach(n => { const k = Phaser.Math.Distance.Between(n.x, n.y, this.player.x, this.player.y); if (k < d) { d = k; best = n; } });
    return best;
  }
  interact() {
    if (this.talking || this.scene.isPaused()) return;
    const n = this.nearestNpc(); if (!n) return;
    this.talking = true; this.player.setVelocity(0);
    window.UI.openDialog(n.npc, () => { this.talking = false; });
  }
  update() {
    const k = this.keys, p = this.player;
    if (this.talking) { p.setVelocity(0); return; }
    const dx = (k.D.isDown || k.RIGHT.isDown || Input.right ? 1 : 0) - (k.A.isDown || k.LEFT.isDown || Input.left ? 1 : 0);
    const dy = (k.S.isDown || k.DOWN.isDown || Input.down ? 1 : 0) - (k.W.isDown || k.UP.isDown || Input.up ? 1 : 0);
    const v = new Phaser.Math.Vector2(dx, dy).normalize().scale(150);
    p.setVelocity(v.x, v.y);
    p.setDepth(p.y + 16);
    if (dx) p.setFlipX(dx < 0);
    const r = this.regionAt(p.x, p.y);
    if (r !== this.regionId) { this.regionId = r; window.UI.announceRegion(REGIONS[r - 1].name); }
  }
}

</script>
<script>
// Interface DOM (menus, diálogos, toque) + inicialização do Phaser.
const $ = id => document.getElementById(id);
window.UI = {
  scene: null, lastFocus: null,
  bindScene(s) { this.scene = s; },
  regionName: '',
  announceRegion(n) { if (n) this.regionName = n; $('region').textContent = 'Região: ' + this.regionName + ' | Estrelas: ' + Save.data.stars.length + '/12'; },
  openDialog(npc, onClose) {
    const m = MISSIONS[npc.id], dlg = $('dialog'), text = $('dlg-text'), list = $('dlg-clues'), opts = $('dlg-opts'), fb = $('dlg-fb'), ok = $('dlg-ok');
    const close = () => { dlg.hidden = true; onClose(); };
    const clear = () => { list.innerHTML = ''; list.hidden = true; opts.innerHTML = ''; fb.textContent = ''; ok.hidden = false; };
    const next = (label, fn) => { ok.textContent = label; ok.onclick = fn; ok.hidden = false; ok.focus(); };
    $('dlg-name').textContent = npc.name + ' — ' + npc.job + ' | Missão: ' + npc.title;
    dlg.hidden = false;
    const win = () => {
      clear();
      if (!Save.data.stars.includes(npc.id)) { Save.data.stars.push(npc.id); Save.save(); }
      this.announceRegion(); if (this.scene) this.scene.refreshMarks();
      text.textContent = '★ ' + m.feedback + ' ' + m.about;
      next('Continuar', close);
    };
    const ask = () => {
      clear(); text.textContent = m.question; ok.hidden = true;
      m.options.forEach((o, i) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = String.fromCharCode(65 + i) + ') ' + o;
        b.onclick = () => { if (i === m.correct) win(); else { fb.textContent = 'Quase! Dica: ' + m.hint + ' Tente outra alternativa.'; b.disabled = true; } };
        opts.appendChild(b); });
      opts.firstChild.focus();
    };
    const clues = () => {
      clear(); text.textContent = 'Pistas que encontrei:';
      m.clues.forEach(c => { const li = document.createElement('li'); li.textContent = c; list.appendChild(li); }); list.hidden = false;
      next('Responder à pergunta', ask);
    };
    if (Save.data.stars.includes(npc.id)) { win(); return; }
    clear(); text.textContent = m.situation; next('Investigar pistas', clues);
  },
  togglePause() {
    const m = $('menu'), s = this.scene; if (!s) return;
    if (m.hidden === false) { this.resume(); } else { s.scene.pause(); m.hidden = false; $('btn-play').textContent = 'Continuar'; $('btn-play').focus(); }
  },
  resume() { $('menu').hidden = true; $('settings').hidden = true; if (this.scene) this.scene.scene.resume(); }
};
Save.load();
const game = new Phaser.Game({
  type: Phaser.AUTO, parent: 'game', backgroundColor: '#1d2547', pixelArt: true,
  scale: { mode: Phaser.Scale.RESIZE, width: '100%', height: '100%' },
  physics: { default: 'arcade', arcade: { debug: false } },
  scene: [BootScene, WorldScene]
});
const started = () => !!window.UI.scene;
$('btn-play').onclick = () => { window.UI.resume(); $('btn-pause').hidden = false; $('hint').hidden = false; };
$('btn-pause').onclick = () => window.UI.togglePause();
$('btn-settings').onclick = () => { $('settings').hidden = false; $('menu').hidden = true; $('opt-contrast').focus(); };
$('set-back').onclick = () => { $('settings').hidden = true; $('menu').hidden = false; $('btn-settings').focus(); };
$('btn-reset').onclick = () => { if (confirm('Apagar todo o progresso salvo?')) { Save.reset(); alert('Progresso apagado.'); } };
[['opt-contrast','contrast'],['opt-bigfont','bigfont'],['opt-calm','calm']].forEach(([id, k]) => {
  $(id).checked = Save.data.settings[k];
  $(id).onchange = e => { Save.data.settings[k] = e.target.checked; Save.save(); Save.applySettings(); };
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('settings').hidden) $('set-back').click(); });
// Controles de toque (aparecem em telas sensíveis ao toque)
if (matchMedia('(pointer: coarse)').matches) $('touch').hidden = false;
document.querySelectorAll('.dpad button').forEach(b => {
  const d = b.dataset.d, on = v => e => { e.preventDefault(); Input[d] = v; };
  ['pointerdown'].forEach(t => b.addEventListener(t, on(true)));
  ['pointerup','pointerleave','pointercancel'].forEach(t => b.addEventListener(t, on(false)));
});
$('btn-act').addEventListener('click', () => window.UI.scene && window.UI.scene.interact());
// Pausa automática: o jogo começa pausado atrás do menu principal
game.events.once('ready', () => { const w = setInterval(() => { if (window.UI.scene && window.UI.scene.scene.isActive()) { window.UI.scene.scene.pause(); clearInterval(w); } }, 50); });

</script>
